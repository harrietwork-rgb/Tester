<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Colour Focus - Perception Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles/explosion.css">

<style>
:root {
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --text-main: #111827;
  --text-soft: #4b5563;
  --bg: #ffffff;
  --box-bg: #f9fafb;
  --border: #e5e7eb;
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
}

body.dark {
  --accent: #60a5fa;
  --accent-soft: #1e3a8a;
  --text-main: #f3f4f6;
  --text-soft: #cbd5e1;
  --bg: #0f172a;
  --box-bg: #1e293b;
  --border: #334155;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

body {
  margin: 0;
  background: var(--bg);
  font-family: system-ui, sans-serif;
  color: var(--text-main);
  display: flex;
  justify-content: center;
  padding: 12px 12px 120px;
}

.app {
  width: 100%;
  max-width: 420px;
  padding: 14px;
  border-radius: 16px;
}

header {
  position: relative;
  margin-bottom: 10px;
}

h1 {
  font-size: 20px;
  margin: 0;
}

.subtitle {
  font-size: 12px;
  color: var(--text-soft);
}

#theme-toggle {
  position: absolute;
  right: 0;
  top: 0;
}

.top-row {
  display: flex;
  gap: 8px;
  margin: 10px 0;
}

.box {
  flex: 1;
  background: var(--box-bg);
  padding: 10px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid var(--border);
}

.box-label {
  font-size: 11px;
  color: var(--text-soft);
}

#timer-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}

.mid-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.mid-box {
  flex: 1;
  background: var(--box-bg);
  border-radius: 10px;
  padding: 8px;
  border: 1px solid var(--border);
  text-align: center;
  font-size: 12px;
}

.grid {
  display: grid;
  gap: 6px;
  margin: 10px 0 8px;
}

.tile {
  width: 100%;
  padding-bottom: 100%;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: transform 0.1s ease;
}

.tile:active {
  transform: scale(0.97);
}

#level-label {
  text-align: center;
  font-weight: 600;
  margin: 6px 0;
}

.game-flash {
  text-align: center;
  font-weight: 700;
  color: var(--accent);
  min-height: 20px;
}

.combo-display {
  text-align: center;
  font-weight: 700;
  font-size: 16px;
  opacity: 0;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.controls button {
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  font-size: 14px;
}

.primary {
  background: var(--accent);
  color: #fff;
}

.ghost {
  background: var(--box-bg);
  border: 1px solid var(--border);
  color: var(--text-main);
}

.mode-row {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: min(420px, calc(100vw - 20px));
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px;
  border-radius: 14px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
}

body.dark .mode-row {
  background: rgba(15, 23, 42, 0.8);
}

@media (max-width: 420px) {
  body { padding: 10px 10px 130px; }
  .mode-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<div class="app">

  <header>
    <h1>Colour Focus</h1>
    <div class="subtitle">Tap the lighter square as quickly as possible</div>
    <button id="theme-toggle">🌙</button>
  </header>

  <div class="top-row">
    <div class="box">
      <div class="box-label">Best Score</div>
      <div id="best-score-value">0</div>
    </div>
    <div class="box">
      <div class="box-label">Best Level</div>
      <div id="best-level-value">1</div>
    </div>
  </div>

  <div class="top-row">
    <div class="box">
      <div class="box-label">Time</div>
      <div id="timer-value">01:00</div>
    </div>
    <div class="box">
      <div class="box-label">Score</div>
      <div id="score-value">0</div>
    </div>
  </div>

  <div class="mid-row">
    <div class="mid-box">Accuracy <div id="accuracy">0%</div></div>
    <div class="mid-box">Lives <div id="lives">❤️❤️❤️</div></div>
  </div>

  <div id="level-label">Level 1</div>
  <div id="game-flash"></div>
  <div id="comboDisplay"></div>

  <div id="grid" class="grid"></div>

  <div class="controls">
    <button id="start-btn" class="primary">Start</button>
    <button id="restart-btn" class="ghost">Restart</button>
  </div>

  <div class="controls">
    <button id="pause-btn" class="ghost">Pause</button>
    <button id="leaderboard-btn" class="ghost">Leaderboard</button>
  </div>

</div>

<div class="mode-row">
  <button data-mode="relaxed" class="ghost active">Relaxed</button>
  <button data-mode="classic" class="ghost">Classic</button>
  <button data-mode="extreme" class="ghost">Extreme</button>
  <button data-mode="daily" class="ghost">Daily</button>
</div>

<script src="scripts/explosion-and-feedback.js"></script>

<script>
(() => {
  const els = {
    body: document.body,
    themeToggle: document.getElementById("theme-toggle"),
    grid: document.getElementById("grid"),
    timer: document.getElementById("timer-value"),
    score: document.getElementById("score-value"),
    bestScore: document.getElementById("best-score-value"),
    bestLevel: document.getElementById("best-level-value"),
    level: document.getElementById("level-label"),
    accuracy: document.getElementById("accuracy"),
    lives: document.getElementById("lives"),
    flash: document.getElementById("game-flash"),
    combo: document.getElementById("comboDisplay"),
    start: document.getElementById("start-btn"),
    restart: document.getElementById("restart-btn"),
    pause: document.getElementById("pause-btn"),
    modeButtons: document.querySelectorAll(".mode-row button")
  };

  const state = {
    mode: "relaxed",
    running: false,
    level: 1,
    score: 0,
    correct: 0,
    wrong: 0,
    lives: 3,
    remaining: 60,
    timer: null,
    oddIndex: 0,
    combo: 0
  };

  const MODE = {
    relaxed: { time: 120, lives: Infinity },
    classic: { time: 60, lives: 3 },
    extreme: { time: 30, lives: 1 },
    daily: { time: 60, lives: 3 }
  };

  function start() {
    reset();
    state.running = true;
    const cfg = MODE[state.mode];
    state.remaining = cfg.time;
    state.lives = cfg.lives;

    tick();
    state.timer = setInterval(tick, 1000);
    nextLevel();
  }

  function reset() {
    clearInterval(state.timer);
    state.level = 1;
    state.score = 0;
    state.correct = 0;
    state.wrong = 0;
    state.combo = 0;

    els.score.textContent = 0;
    els.accuracy.textContent = "0%";
    els.lives.textContent = "❤️❤️❤️";
  }

  function tick() {
    if (!state.running) return;
    state.remaining--;
    els.timer.textContent = format(state.remaining);
    if (state.remaining <= 0) end();
  }

  function format(s) {
    const m = String(Math.floor(s / 60)).padStart(2, "0");
    const r = String(s % 60).padStart(2, "0");
    return `${m}:${r}`;
  }

  function nextLevel() {
    const size = Math.min(2 + Math.floor(state.level / 3), 6);
    const total = size * size;

    els.grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    els.grid.innerHTML = "";

    state.oddIndex = Math.floor(Math.random() * total);

    const base = randomColor();
    const odd = randomColor(true);

    for (let i = 0; i < total; i++) {
      const d = document.createElement("div");
      d.className = "tile";
      d.style.background = i === state.oddIndex ? odd : base;
      d.onclick = () => click(i);
      els.grid.appendChild(d);
    }

    els.level.textContent = "Level " + state.level;
  }

  function click(i) {
    if (!state.running) return;

    if (i === state.oddIndex) {
      state.correct++;
      state.combo++;
      state.score += 10 + state.level;
      els.score.textContent = state.score;
      flash("+score");
      state.level++;
      nextLevel();
    } else {
      state.wrong++;
      state.combo = 0;
      state.lives--;
      updateLives();
      if (state.lives <= 0) end();
    }

    updateAccuracy();
  }

  function updateAccuracy() {
    const total = state.correct + state.wrong;
    const pct = total ? Math.round((state.correct / total) * 100) : 0;
    els.accuracy.textContent = pct + "%";
  }

  function updateLives() {
    els.lives.textContent = state.lives === Infinity ? "∞" : "❤️".repeat(state.lives);
  }

  function randomColor(odd = false) {
    const h = Math.floor(Math.random() * 360);
    const l = odd ? 65 : 50;
    return `hsl(${h},70%,${l}%)`;
  }

  function flash(t) {
    els.flash.textContent = t;
    setTimeout(() => els.flash.textContent = "", 400);
  }

  function end() {
    state.running = false;
    clearInterval(state.timer);
    alert("Game over! Score: " + state.score);
  }

  els.start.onclick = start;
  els.restart.onclick = start;
  els.pause.onclick = () => state.running = false;

  els.themeToggle.onclick = () => document.body.classList.toggle("dark");

  els.modeButtons.forEach(b => {
    b.onclick = () => state.mode = b.dataset.mode;
  });

})();
</script>

</body>
</html>
